{% extends "base.html" %}

{% block title %}
<title>Edit Item</title>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Edit Lost Item</h1>
    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required>{{ item.description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" value="{{ item.category }}" required>
        </div>
        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <input type="text" class="form-control" id="brand" name="brand" value="{{ item.brand }}">
        </div>
        <div class="mb-3">
            <label for="colour" class="form-label">Primary Colour</label>
            <input type="text" class="form-control" id="colour" name="colour" value="{{ item.colour }}">
        </div>
        <div class="mb-3">
            <label for="additional_info" class="form-label">Additional Info</label>
            <textarea class="form-control" id="additional_info" name="additional_info" rows="3">{{ item.additional_info }}</textarea>
        </div>
        <div class="mb-3">
            <label for="location_lost" class="form-label">Location Lost</label>
            <input type="text" class="form-control" id="location_lost" name="location_lost" value="{{ item.location_lost }}" required>
        </div>
        <div class="mb-3">
            <label for="date_lost" class="form-label">Date Lost</label>
            <input type="date" class="form-control" id="date_lost" name="date_lost" value="{{ item.date_lost.strftime('%Y-%m-%d') }}" max="{{ current_date }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
